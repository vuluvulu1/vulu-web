<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMax slice">
      <defs>
        <radialGradient id="sky" cx="50%" cy="0%" r="75%">
          <stop offset="0" stop-color="#6a4520"></stop>
          <stop offset=".3" stop-color="#2a1a0e"></stop>
          <stop offset=".7" stop-color="#0d0c0b"></stop>
          <stop offset="1" stop-color="#06080b"></stop>
        </radialGradient>
        <!-- Gece: köşelerde soğuk mavi, altın ışık bununla parlar -->
        <radialGradient id="night" cx="50%" cy="15%" r="85%">
          <stop offset=".3" stop-color="#0c1724" stop-opacity="0"></stop>
          <stop offset=".75" stop-color="#0c1724" stop-opacity=".75"></stop>
          <stop offset="1" stop-color="#070d15" stop-opacity=".95"></stop>
        </radialGradient>
        <linearGradient id="ray" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff6de" stop-opacity=".95"></stop>
          <stop offset=".4" stop-color="#ffd08a" stop-opacity=".38"></stop>
          <stop offset="1" stop-color="#f2a33a" stop-opacity="0"></stop>
        </linearGradient>
        <!-- Gövde: gölge yüzü soğuk, ışık yüzü sıcak -->
        <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#0b1119"></stop>
          <stop offset=".32" stop-color="#232a30"></stop>
          <stop offset=".62" stop-color="#5a4733"></stop>
          <stop offset=".85" stop-color="#9a7a57"></stop>
          <stop offset="1" stop-color="#4a3a2b"></stop>
        </linearGradient>
        <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#937455"></stop>
          <stop offset="1" stop-color="#2f2a26"></stop>
        </linearGradient>
        <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#2a2a2c"></stop>
          <stop offset=".6" stop-color="#5a4836"></stop>
          <stop offset="1" stop-color="#8a6d50"></stop>
        </linearGradient>
        <radialGradient id="pool" cx="50%" cy="50%" r="50%">
          <stop offset="0" stop-color="#ffcf88" stop-opacity=".42"></stop>
          <stop offset="1" stop-color="#ffcf88" stop-opacity="0"></stop>
        </radialGradient>
        <radialGradient id="vignette" cx="50%" cy="45%" r="75%">
          <stop offset=".55" stop-color="#05070a" stop-opacity="0"></stop>
          <stop offset="1" stop-color="#05070a" stop-opacity=".85"></stop>
        </radialGradient>
        <filter id="blur-l" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"></feGaussianBlur></filter>
        <filter id="blur-xl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="34"></feGaussianBlur></filter>
        <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter>
        <!-- İyon sütunu -->
        <symbol id="col" viewBox="0 0 120 900">
          <rect x="0" y="0" width="120" height="14" fill="url(#stone)"></rect>
          <rect x="8" y="14" width="104" height="22" fill="url(#stone)"></rect>
          <circle cx="15" cy="32" r="15" fill="url(#stone)" stroke="#14161a" stroke-width="1.2"></circle>
          <circle cx="15" cy="32" r="9" fill="none" stroke="#d9b88a" stroke-opacity=".35" stroke-width="1.2"></circle>
          <circle cx="15" cy="32" r="4" fill="#1d1c1c"></circle>
          <circle cx="105" cy="32" r="15" fill="url(#stone)" stroke="#14161a" stroke-width="1.2"></circle>
          <circle cx="105" cy="32" r="9" fill="none" stroke="#d9b88a" stroke-opacity=".35" stroke-width="1.2"></circle>
          <circle cx="105" cy="32" r="4" fill="#1d1c1c"></circle>
          <rect x="16" y="40" width="88" height="12" fill="#4d3c2c"></rect>
          <rect x="20" y="52" width="80" height="790" fill="url(#shaft)"></rect>
          <g fill="#000" fill-opacity=".30">
            <rect x="25" y="58" width="4" height="778" rx="2"></rect><rect x="35" y="58" width="4" height="778" rx="2"></rect>
            <rect x="45" y="58" width="4" height="778" rx="2"></rect><rect x="55" y="58" width="4" height="778" rx="2"></rect>
            <rect x="65" y="58" width="4" height="778" rx="2"></rect><rect x="75" y="58" width="4" height="778" rx="2"></rect>
            <rect x="85" y="58" width="4" height="778" rx="2"></rect><rect x="93" y="58" width="3" height="778" rx="1.5"></rect>
          </g>
          <g fill="#ffe2b4" fill-opacity=".10">
            <rect x="29.5" y="58" width="1.2" height="778"></rect><rect x="39.5" y="58" width="1.2" height="778"></rect>
            <rect x="49.5" y="58" width="1.2" height="778"></rect><rect x="59.5" y="58" width="1.2" height="778"></rect>
            <rect x="69.5" y="58" width="1.4" height="778" fill-opacity=".16"></rect><rect x="79.5" y="58" width="1.4" height="778" fill-opacity=".22"></rect>
            <rect x="89.5" y="58" width="1.4" height="778" fill-opacity=".26"></rect>
          </g>
          <rect x="14" y="842" width="92" height="14" rx="7" fill="url(#stone)"></rect>
          <rect x="6" y="856" width="108" height="44" fill="url(#stone)"></rect>
        </symbol>
        <!-- Bir yanın sütun dizisi ve üstündeki, uzaklaştıkça incelen taş kiriş -->
        <g id="colonnade">
          <use href="#col" x="512" y="490" width="74" height="560" opacity=".42"></use>
          <use href="#col" x="340" y="330" width="104" height="780" opacity=".72"></use>
          <use href="#col" x="120" y="165" width="138" height="1035"></use>
          <polygon points="0,-60 610,508 610,532 0,-6" fill="url(#beam)" opacity=".85"></polygon>
          <polyline points="0,-6 610,532" fill="none" stroke="#e6c48f" stroke-opacity=".3" stroke-width="1.6"></polyline>
        </g>
      </defs>

      <rect width="1600" height="1200" fill="url(#sky)"></rect>
      <rect width="1600" height="1200" fill="url(#night)"></rect>

      <!-- Bulutlar -->
      <g filter="url(#blur-xl)" fill="#ffe2b0">
        <ellipse cx="500" cy="70" rx="300" ry="80" opacity=".10"></ellipse>
        <ellipse cx="800" cy="30" rx="360" ry="90" opacity=".24"></ellipse>
        <ellipse cx="1100" cy="70" rx="300" ry="80" opacity=".10"></ellipse>
        <ellipse cx="660" cy="150" rx="200" ry="50" opacity=".08"></ellipse>
        <ellipse cx="950" cy="150" rx="200" ry="50" opacity=".08"></ellipse>
      </g>

      <!-- Sütun dizisi; sağ taraf aynalanır, ışıklı yüz hep ortaya bakar -->
      <use href="#colonnade"></use>
      <use href="#colonnade" transform="translate(1600 0) scale(-1 1)"></use>

      <!-- Tanrı ışınları -->
      <g filter="url(#blur-l)" fill="url(#ray)">
        <polygon points="770,-60 830,-60 1230,1200 370,1200" opacity=".32"></polygon>
        <polygon points="788,-60 812,-60 990,1200 610,1200" opacity=".58"></polygon>
        <polygon points="776,-60 792,-60 420,1200 300,1200" opacity=".13"></polygon>
        <polygon points="808,-60 824,-60 1300,1200 1180,1200" opacity=".13"></polygon>
        <polygon points="780,-60 796,-60 600,1200 520,1200" opacity=".18"></polygon>
        <polygon points="804,-60 820,-60 1080,1200 1000,1200" opacity=".18"></polygon>
      </g>

      <ellipse cx="800" cy="1150" rx="640" ry="110" fill="url(#pool)"></ellipse>

      <!-- Toz zerreleri: iki katman, çok yavaş süzülür -->

      <rect width="1600" height="1200" filter="url(#grain)" opacity=".07"></rect>
      <rect width="1600" height="1200" fill="url(#vignette)"></rect>
    </svg>

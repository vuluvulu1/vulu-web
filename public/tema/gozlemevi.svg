<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" preserveAspectRatio="xMidYMax slice">
      <defs>
        <radialGradient id="g-sky" cx="50%" cy="20%" r="85%"><stop offset="0" stop-color="#1c1638"></stop><stop offset=".5" stop-color="#0d0b1e"></stop><stop offset="1" stop-color="#050409"></stop></radialGradient>
        <pattern id="g-stars1" width="220" height="220" patternUnits="userSpaceOnUse">
          <circle cx="12" cy="30" r="1" fill="#fff"></circle><circle cx="80" cy="12" r=".8" fill="#dfe6ff"></circle><circle cx="150" cy="50" r="1.2" fill="#fff"></circle>
          <circle cx="200" cy="100" r=".7" fill="#ffe9c8"></circle><circle cx="40" cy="120" r=".9" fill="#fff"></circle><circle cx="110" cy="160" r=".6" fill="#dfe6ff"></circle>
          <circle cx="180" cy="190" r="1" fill="#fff"></circle><circle cx="60" cy="200" r=".7" fill="#ffe9c8"></circle><circle cx="130" cy="95" r=".5" fill="#fff"></circle>
        </pattern>
        <pattern id="g-stars2" width="370" height="370" patternUnits="userSpaceOnUse">
          <circle cx="50" cy="70" r="1.6" fill="#fff"></circle><circle cx="260" cy="40" r="1.3" fill="#ffe2b0"></circle><circle cx="320" cy="250" r="1.7" fill="#dfe6ff"></circle>
          <circle cx="140" cy="300" r="1.4" fill="#fff"></circle><circle cx="200" cy="180" r="1.1" fill="#ffe2b0"></circle>
        </pattern>
        <linearGradient id="g-milky" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6a4fb0" stop-opacity="0"></stop><stop offset=".5" stop-color="#c9a6ff" stop-opacity=".22"></stop><stop offset="1" stop-color="#6a4fb0" stop-opacity="0"></stop></linearGradient>
        <radialGradient id="g-planet" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="#3a2a55"></stop><stop offset=".4" stop-color="#1a1330"></stop><stop offset="1" stop-color="#07060d"></stop></radialGradient>
        <filter id="g-blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="40"></feGaussianBlur></filter>
        <filter id="g-glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="8"></feGaussianBlur></filter>
      </defs>
      <rect width="1600" height="1200" fill="url(#g-sky)"></rect>
      <ellipse cx="800" cy="420" rx="900" ry="120" fill="url(#g-milky)" transform="rotate(-18 800 420)" filter="url(#g-blur)"></ellipse>
      <rect width="1600" height="1200" fill="url(#g-stars1)" opacity=".75"></rect>
      <!-- Takımyıldız: launcher'ın çevresini saran çizgiler -->
      <g stroke="#ffd9a0" stroke-opacity=".35" stroke-width="1.4" fill="none">
        <polyline points="230,250 380,190 520,240 600,170"></polyline>
        <polyline points="1370,260 1220,200 1080,250 1000,170"></polyline>
        <polyline points="180,640 300,560 280,430 380,360"></polyline>
        <polyline points="1420,620 1300,560 1320,430 1220,360"></polyline>
      </g>
      <g fill="#fff4dc">
        <circle cx="230" cy="250" r="3"></circle><circle cx="380" cy="190" r="4"></circle><circle cx="520" cy="240" r="3"></circle><circle cx="600" cy="170" r="5"></circle>
        <circle cx="1370" cy="260" r="3"></circle><circle cx="1220" cy="200" r="4"></circle><circle cx="1080" cy="250" r="3"></circle><circle cx="1000" cy="170" r="5"></circle>
        <circle cx="180" cy="640" r="3"></circle><circle cx="300" cy="560" r="4"></circle><circle cx="280" cy="430" r="3"></circle><circle cx="380" cy="360" r="4"></circle>
        <circle cx="1420" cy="620" r="3"></circle><circle cx="1300" cy="560" r="4"></circle><circle cx="1320" cy="430" r="3"></circle><circle cx="1220" cy="360" r="4"></circle>
      </g>
      <g fill="#ffd9a0" opacity=".5" filter="url(#g-glow)"><circle cx="600" cy="170" r="10"></circle><circle cx="1000" cy="170" r="10"></circle><circle cx="380" cy="190" r="8"></circle><circle cx="1220" cy="200" r="8"></circle></g>
      <!-- Gezegen ufku -->
      <circle cx="800" cy="2150" r="1180" fill="url(#g-planet)"></circle>
      <circle cx="800" cy="2150" r="1180" fill="none" stroke="#ffb46a" stroke-width="14" opacity=".55" filter="url(#g-glow)"></circle>
      <circle cx="800" cy="2150" r="1180" fill="none" stroke="#ffe2b0" stroke-width="2" opacity=".8"></circle>
      <circle cx="800" cy="2150" r="1240" fill="none" stroke="#ff9a4a" stroke-width="60" opacity=".10" filter="url(#g-blur)"></circle>
    </svg>
